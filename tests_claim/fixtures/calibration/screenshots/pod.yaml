apiVersion: v1
kind: Pod
metadata:
  name: claim-screenshot-cal
  namespace: witness-dev
  labels:
    app: claim-screenshot-cal
    purpose: match-screenshot-calibration
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 3600
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: cal
    image: acrpwwpoland.azurecr.io/claim-witness:dev-8ca79b4@sha256:829dae31e192de5c1a724755c65c1eab7a52205b4f18ac54854649b0f2e48af7
    imagePullPolicy: IfNotPresent
    command: ["/bin/sh", "-c"]
    args:
    - |
      echo "cal pod up, waiting for the set"
      while [ ! -f /cal/in/READY ]; do sleep 2; done
      PYTHONPATH=/app python3 /cal/in/screenshots/measure.py /cal/in/screenshots /cal/out
      echo "EXIT $?"
      while [ ! -f /cal/out/FETCHED ]; do sleep 2; done
      echo "fetched, exiting"
    env:
    - name: CAL_IMAGE
      value: acrpwwpoland.azurecr.io/claim-witness:dev-8ca79b4@sha256:829dae31e192de5c1a724755c65c1eab7a52205b4f18ac54854649b0f2e48af7
    resources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 500m
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    volumeMounts:
    - name: cal
      mountPath: /cal
  volumes:
  - name: cal
    emptyDir:
      sizeLimit: 64Mi
