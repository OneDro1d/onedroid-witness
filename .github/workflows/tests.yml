name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the pinned checker is the one the service refuses to run without
        run: |
          echo "96c6dbb214b2171171ffdd6b0d9c5ede446d16501247b8df2420589c1033aa26  vendor/check.py" | sha256sum -c -
      - name: tests (offline, recorded answers; ssh-keygen from the runner's OpenSSH)
        run: python3 -m unittest discover -s tests -v
