name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the pinned checker is the one the service refuses to run without
        run: |
          echo "af216591d73b1249453b35e35d35e8765286eec5ba50bb2b8c6fc22c02a9885c  vendor/check.py" | sha256sum -c -
      - name: tests (offline, recorded answers; ssh-keygen from the runner's OpenSSH)
        run: python3 -m unittest discover -s tests -v
