name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the pinned checker is the one the service refuses to run without
        run: |
          echo "a0cef79a82ffeecacd0aaa9754e1e7afca3671851ba5418e61c8fc3b541e2d06  vendor/check.py" | sha256sum -c -
      - name: tests (offline, recorded answers; ssh-keygen from the runner's OpenSSH)
        run: python3 -m unittest discover -s tests -v
