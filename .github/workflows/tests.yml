name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the pinned checker is the one the service refuses to run without
        run: |
          echo "ff30460696c8656075864a5874c1d1f10d5a45befe68addc5944981c511eedec  vendor/check.py" | sha256sum -c -
      - name: tests (offline, recorded answers; ssh-keygen from the runner's OpenSSH)
        run: python3 -m unittest discover -s tests -v
