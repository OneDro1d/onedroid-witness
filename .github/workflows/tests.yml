name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the pinned checker is the one the service refuses to run without
        run: |
          echo "559e54a934fcca2ec70ef4b7ac60c1d9366cd4b98e56049f8556991789411947  vendor/check.py" | sha256sum -c -
      - name: tests (offline, recorded answers; ssh-keygen from the runner's OpenSSH)
        run: python3 -m unittest discover -s tests -v
