# claim-witness slices B1, B6, B2b and B3 on the DEV cluster, namespace witness-dev (DECISIONS BD6, BD7), beside the old onedroid-witness until
# B8. The orchestrator sets the image at rollout time (IMAGE_PLACEHOLDER). Secrets are referenced by NAME only; how to create
# each one is in README_CLAIM.md, "Secrets". Nothing here holds a secret value.
#
#   claim-pg       Postgres 16 + pgvector, one replica, its own PVC (BD7)
#   claim-witness  the API container plus the signer sidecar; they share an emptyDir holding only the signer's Unix socket.
#                  The signing key is mounted into the signer container alone. The Service exposes the API port only.
#                  B6: the model backend's key (Secret onedroid-witness-openrouter) and model list (ConfigMap
#                  claim-witness-judge-models) are mounted into the api container alone, both optional.
apiVersion: v1
kind: Service
metadata:
  name: claim-pg
  namespace: witness-dev
  labels: {app: claim-pg}
spec:
  clusterIP: None
  selector: {app: claim-pg}
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: claim-pg
  namespace: witness-dev
spec:
  serviceName: claim-pg
  replicas: 1
  selector:
    matchLabels: {app: claim-pg}
  template:
    metadata:
      labels: {app: claim-pg}
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports: [{containerPort: 5432, name: postgres}]
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: claim-pg-credentials, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: claim-pg-credentials, key: password}}
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: claim-pg-credentials, key: database}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          volumeMounts:
            - {name: pgdata, mountPath: /var/lib/postgresql/data}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
  volumeClaimTemplates:
    - metadata:
        name: pgdata
        namespace: witness-dev
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claim-witness
  namespace: witness-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: claim-witness}
  template:
    metadata:
      labels: {app: claim-witness}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: IMAGE_PLACEHOLDER
          args: ["api"]
          ports: [{containerPort: 8080, name: http}]
          env:
            - {name: WITNESS_ID, value: "witness:onedroid-dev"}
            - {name: WITNESS_SIGNER_SOCKET, value: /run/claim-witness/signer.sock}
            - name: WITNESS_DATABASE_URL
              valueFrom: {secretKeyRef: {name: claim-pg-credentials, key: url}}
            - {name: WITNESS_ATTEMPT_KEY_FILE, value: /etc/claim-witness/attempt/key}
            - {name: WITNESS_MASTER_KEY_FILE, value: /etc/claim-witness/master/key}
            - {name: WITNESS_DEV_KEYS_FILE, value: /etc/claim-witness/dev-keys/dev-keys.json}
            # BD8, B4a: the BFF's service key list (onedroid-bus GET /bff/v1/keys/service, the public half of the BFF's
            # credits.settler_key_file: one key, the one the BFF signs its calls to this witness with, service claim-witness).
            # In-cluster: Service `bff` (port 80) in namespace evidence-dev. The dev keys above stay for testing (BD8).
            # The store-gateway's store key list is NOT used here: its public store has open self sign-up.
            - {name: WITNESS_CALLER_KEYS_URL, value: "http://bff.evidence-dev.svc.cluster.local/bff/v1/keys/service"}
            - {name: WITNESS_PORT, value: "8080"}
            # B6 judge.supports: any OpenAI-compatible endpoint, by env only. The key file comes from Secret
            # onedroid-witness-openrouter (key `key`) and the model list from ConfigMap claim-witness-judge-models (key
            # models.json). Both volumes are optional: until the orchestrator creates them, judge.supports answers 503
            # judge-not-configured and every other method works as before. README_CLAIM.md, "judge.supports".
            - {name: WITNESS_JUDGE_BASE_URL, value: "https://openrouter.ai/api/v1"}
            - {name: WITNESS_JUDGE_API_KEY_FILE, value: /etc/claim-witness/judge-key/key}
            - {name: WITNESS_JUDGE_MODELS_FILE, value: /etc/claim-witness/judge-models/models.json}
            # B2b: the page fetcher (Deployment claim-fetcher, k8s/fetcher-dev.yaml) and its shared secret: Secret
            # claim-fetcher-secret, key `secret`, mounted read-only at /etc/claim-witness/fetcher (volume fetcher-secret)
            - {name: FETCHER_URL, value: "http://claim-fetcher.witness-dev.svc.cluster.local"}
            - {name: FETCHER_SECRET_FILE, value: /etc/claim-witness/fetcher/secret}
            # match.screenshot's code_sha256: the digest of this image (sha256:...), set by the orchestrator at rollout
            - {name: WITNESS_IMAGE_DIGEST, value: "IMAGE_DIGEST_PLACEHOLDER"}
            - {name: WITNESS_RESOLVERS, value: "1.1.1.1,8.8.8.8"}
            - {name: WITNESS_CONFIRM_DELAY_S, value: "60"}
            # B3 sealer (SPEC §7.2), a thread of this container: a batch closes when its oldest leaf is
            # WITNESS_BATCH_INTERVAL_S old or it holds WITNESS_BATCH_MAX_LEAVES leaves. README_CLAIM.md, "Sealer".
            - {name: WITNESS_BATCH_INTERVAL_S, value: "3600"}
            - {name: WITNESS_BATCH_MAX_LEAVES, value: "100000"}
            - {name: WITNESS_SEALER, value: "1"}
            - {name: WITNESS_SEALER_POLL_S, value: "30"}
            # The armarium notary (hash/1), homelab notary through the AKS bridge. Token: Secret armarium-claim-witness (key
            # `token`, anchor:write + read, profile hash/1, chains lab-qbft and base-sepolia); CA: ConfigMap armarium-ca (key
            # `ca.crt`, the homelab CA). Both volumes are optional: without the token file the notary is off and seals stay
            # pending. The URL is not a secret.
            - {name: WITNESS_NOTARY_URL, value: "https://armarium-notary.armarium-lab.svc.cluster.local:9000"}
            - {name: WITNESS_NOTARY_TOKEN_FILE, value: /etc/claim-witness/notary/token}
            - {name: WITNESS_NOTARY_CA_FILE, value: /etc/claim-witness/armarium-ca/ca.crt}
            # n-dim (BD4) through armarium's object service on prov-poland-aks: one claimant chain per owner under the
            # claim-witness case ARMARIUM_CASE. Token: Secret armarium-claim-witness-objects (key `token`, object:read +
            # object:write + lifecycle + read, bound to that case, so it covers every claimant made under it); CA: ConfigMap
            # armarium-objects-ca (key `ca.crt`, a DIFFERENT CA from the notary's). Without the token file nothing is written
            # and every kept record says n-dim "not-configured". NDIM_STORE_EVIDENCE=1 also writes kept evidence ciphertext
            # (BD4 option C).
            - {name: ARMARIUM_URL, value: "https://armarium-objects.armarium-objects-dev.svc.cluster.local:9000"}
            - {name: ARMARIUM_TOKEN_FILE, value: /etc/claim-witness/armarium-objects/token}
            - {name: ARMARIUM_CA_FILE, value: /etc/claim-witness/armarium-objects-ca/ca.crt}
            - {name: ARMARIUM_CASE, value: "1e59334fee73fc758f793ce01c3cdd00"}
            - {name: NDIM_STORE_EVIDENCE, value: "0"}
            - {name: WITNESS_LINK_BASE, value: "https://evidence.onedroid.ai"}
          volumeMounts:
            - {name: socket, mountPath: /run/claim-witness}
            - {name: attempt-key, mountPath: /etc/claim-witness/attempt, readOnly: true}
            - {name: master-key, mountPath: /etc/claim-witness/master, readOnly: true}
            - {name: dev-keys, mountPath: /etc/claim-witness/dev-keys, readOnly: true}
            - {name: judge-key, mountPath: /etc/claim-witness/judge-key, readOnly: true}
            - {name: judge-models, mountPath: /etc/claim-witness/judge-models, readOnly: true}
            - {name: fetcher-secret, mountPath: /etc/claim-witness/fetcher, readOnly: true}
            - {name: notary-token, mountPath: /etc/claim-witness/notary, readOnly: true}
            - {name: armarium-token, mountPath: /etc/claim-witness/armarium-objects, readOnly: true}
            - {name: armarium-ca, mountPath: /etc/claim-witness/armarium-ca, readOnly: true}
            - {name: armarium-objects-ca, mountPath: /etc/claim-witness/armarium-objects-ca, readOnly: true}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
        - name: signer
          image: IMAGE_PLACEHOLDER
          args: ["signer", "serve"]
          env:
            - {name: WITNESS_ID, value: "witness:onedroid-dev"}
            - {name: WITNESS_KEY_ID, value: "witness:onedroid-dev:2026a"}
            - {name: WITNESS_SIGNER_SOCKET, value: /run/claim-witness/signer.sock}
            - {name: WITNESS_SIGNING_KEY_FILE, value: /etc/claim-witness/signing/key}
            - name: WITNESS_DATABASE_URL
              valueFrom: {secretKeyRef: {name: claim-pg-credentials, key: url}}
            # dev only: on the very first start, with no key list in the database, sign key list 1 with this key. Every later
            # list is signed by the operator command (README_CLAIM.md, "Rotating the key").
            - {name: WITNESS_SIGNER_BOOTSTRAP, value: "1"}
          volumeMounts:
            - {name: socket, mountPath: /run/claim-witness}
            - {name: signing-key, mountPath: /etc/claim-witness/signing, readOnly: true}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: socket
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: signing-key
          secret: {secretName: claim-witness-signing-key, defaultMode: 0440}
        - name: attempt-key
          secret: {secretName: claim-witness-attempt-key, defaultMode: 0440}
        - name: master-key
          secret: {secretName: claim-witness-master-key, defaultMode: 0440}
        - name: dev-keys
          secret: {secretName: claim-witness-dev-keys, defaultMode: 0440}
        - name: judge-key
          secret:
            secretName: onedroid-witness-openrouter
            optional: true
            defaultMode: 0440
            items:
              - {key: key, path: key}
        - name: judge-models
          configMap:
            name: claim-witness-judge-models
            optional: true
            items:
              - {key: models.json, path: models.json}
        # the fetcher's shared secret (the same Secret the claim-fetcher Deployment reads), key `secret`
        - name: fetcher-secret
          secret: {secretName: claim-fetcher-secret, defaultMode: 0440, items: [{key: secret, path: secret}]}
        # B3 and B3W, all optional (the pod starts without them): the notary's token and CA, the object service's token and CA
        - name: notary-token
          secret:
            secretName: armarium-claim-witness
            optional: true
            defaultMode: 0440
            items:
              - {key: token, path: token}
        - name: armarium-token
          secret:
            secretName: armarium-claim-witness-objects
            optional: true
            defaultMode: 0440
            items:
              - {key: token, path: token}
        - name: armarium-ca
          configMap:
            name: armarium-ca
            optional: true
            items:
              - {key: ca.crt, path: ca.crt}
        - name: armarium-objects-ca
          configMap:
            name: armarium-objects-ca
            optional: true
            items:
              - {key: ca.crt, path: ca.crt}
---
apiVersion: v1
kind: Service
metadata:
  name: claim-witness
  namespace: witness-dev
  labels: {app: claim-witness}
spec:
  selector: {app: claim-witness}
  ports:
    - name: http
      port: 80
      targetPort: 8080
