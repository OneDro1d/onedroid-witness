---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: onedroid-witness-data
  namespace: witness-dev
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onedroid-witness
  namespace: witness-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: onedroid-witness}
  template:
    metadata:
      labels: {app: onedroid-witness}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        # without this, every pod start re-applies g+rw to every file on the PVC and ssh-keygen refuses the 0660 private keys (12 Nov 2026)
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: witness
          image: IMAGE_PLACEHOLDER
          ports: [{containerPort: 8080}]
          volumeMounts:
            - {name: config, mountPath: /etc/onedroid-witness, readOnly: true}
            - {name: openrouter, mountPath: /etc/onedroid-witness/openrouter, readOnly: true}
            - {name: data, mountPath: /var/lib/onedroid-witness}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
      volumes:
        - name: config
          configMap: {name: onedroid-witness-config}
        - name: openrouter
          secret: {secretName: onedroid-witness-openrouter}
        - name: data
          persistentVolumeClaim: {claimName: onedroid-witness-data}
---
apiVersion: v1
kind: Service
metadata:
  name: onedroid-witness
  namespace: witness-dev
spec:
  selector: {app: onedroid-witness}
  ports: [{port: 80, targetPort: 8080}]
